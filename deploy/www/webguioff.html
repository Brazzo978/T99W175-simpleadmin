<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Simple T99</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f8; --card: #fff; --fg: #18181b; --muted: #71717a; --border: #e4e4e7; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #09090b; --card: #18181b; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
             color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(28rem, calc(100% - 2rem)); background: var(--card); border: 1px solid var(--border);
             border-radius: 12px; padding: 2rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 0.75rem; }
      small { color: var(--muted); }
      img { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/simple-t99-icon.png" alt="Simple T99" />
      <h1>Interface locked</h1>
      <p>The web GUI is currently locked for maintenance.</p>
      <p>If you need access or you are experiencing issues, contact: <strong>XXX</strong></p>
      <small>If you have a maintenance link, use it to unlock the interface.</small>
    </main>
  </body>
</html>
