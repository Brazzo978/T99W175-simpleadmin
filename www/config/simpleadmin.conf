# SimpleAdmin configuration
# Set to 0 to completely disable login and allow open access.
# Set to 1 (default) to require user login.
SIMPLEADMIN_ENABLE_LOGIN=1

# GUI lock: when set, the web interface redirects to SIMPLEADMIN_GUI_LOCK_PAGE and
# CGI endpoints will behave as unauthenticated.
SIMPLEADMIN_GUI_LOCKED=0

# Pre-shared key to toggle GUI lock via /cgi-bin/gui_toggle?key=... (or ?k=...).
# Example: /cgi-bin/gui_toggle?key=YOUR_KEY&mode=toggle|lock|unlock
SIMPLEADMIN_GUI_TOGGLE_KEY=""

# Page shown while locked.
SIMPLEADMIN_GUI_LOCK_PAGE="/webguioff.html"

# eSIM management page (requires the intermediate euicc-client server)
# Set to 1 to show and enable the eSIM management UI, 0 to hide it.
SIMPLEADMIN_ENABLE_ESIM=0

# Base URL for the eSIM intermediate server (default: local euicc-client API)
SIMPLEADMIN_ESIM_BASE_URL="http://localhost:8080/api/v1"

# Connection monitoring configuration
# Ping targets: comma-separated list of hosts to ping
SIMPLEADMIN_PING_TARGETS="8.8.8.8,1.1.1.1"

# DNS tests: comma-separated list of server:domain pairs for DNS resolution tests
SIMPLEADMIN_DNS_TESTS="8.8.8.8:www.google.com,1.1.1.1:www.google.com"

# Advanced DIAG signal dashboard
SIMPLEADMIN_QDIAG_BIN="/opt/scripts/diag/qdiagmon-dci"
SIMPLEADMIN_QDIAG_STATE_FILE="/tmp/qdiag-state.json"
SIMPLEADMIN_QDIAG_ERR_FILE="/tmp/qdiag-state.err"
SIMPLEADMIN_QDIAG_PID_FILE="/tmp/qdiag-state.pid"
SIMPLEADMIN_QDIAG_START_FILE="/tmp/qdiag-state.started"
SIMPLEADMIN_QDIAG_SNAPSHOT_INTERVAL_MS=10000
SIMPLEADMIN_QDIAG_STALE_AFTER_MS=30000
SIMPLEADMIN_QDIAG_SAMPLE_MIN_MS=500
SIMPLEADMIN_QDIAG_MAX_RUNTIME_SEC=10
SIMPLEADMIN_QDIAG_REQUIRE="nr"
